<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOMA Admin</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--card:#fff;--ink:#181818;--mute:#78746b;--line:#E6E2D8;--tile:#EEEAE0;--ok:#1d6b3a;--warn:#9a6a00;--bad:#B3261E;--sans:'Jost',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
[data-theme=dark]{--bg:#121212;--card:#1A1A19;--ink:#F2EFE8;--mute:#9a968c;--line:#2A2A28;--tile:#222221;--ok:#5fc084;--warn:#e0b04a;--bad:#ef7b73}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}input{font:inherit;color:inherit}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:100%;max-width:340px;text-align:center}.lbox h1{font-weight:500;letter-spacing:.3em;font-size:22px;margin:0 0 6px}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;margin:18px 0 10px;outline:none}.inp:focus{border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-weight:500}
.btn.full{width:100%;padding:13px}.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:7px 13px;font-size:13px}.btn.red{background:none;color:var(--bad);border:1px solid var(--line)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}.mute{color:var(--mute)}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:500;letter-spacing:.3em;font-size:16px;padding:0 10px 18px}
.nav{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;color:var(--mute);text-align:left;width:100%}
.nav.on{background:var(--tile);color:var(--ink)}.nav .n{margin-left:auto;font-size:12px;background:var(--ink);color:var(--bg);border-radius:999px;padding:0 7px}
.sp{flex:1}.main{padding:26px 30px 60px;max-width:1100px;width:100%}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.hd h2{margin:0;font-weight:500;font-size:24px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.c small{color:var(--mute);display:block;margin-bottom:6px}.c b{font-size:24px;font-weight:500}
.row2{display:grid;grid-template-columns:3fr 2fr;gap:12px;margin-top:12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:14px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.bars i{display:block;background:var(--ink);border-radius:6px 6px 0 0;min-height:2px;margin-bottom:6px}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;font-weight:400;color:var(--mute);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line)}.tbl tr.k{cursor:pointer}.tbl tr.k:hover td{background:var(--tile)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12px}
.s-new{color:var(--warn)}.s-accepted,.s-on_way{color:var(--ink)}.s-delivered{color:var(--ok)}.s-cancelled{color:var(--bad)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--card);border-left:1px solid var(--line);padding:22px;overflow:auto;transform:translateX(105%);transition:transform .22s;z-index:30}
.drawer.on{transform:none}.dl{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}.dl span:first-child{color:var(--mute)}
.acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.empty{padding:40px;text-align:center;color:var(--mute)}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px;align-items:center}.brand{padding:0 10px}.nav{width:auto;white-space:nowrap}.sp{display:none}
.main{padding:18px 14px 60px}.cards{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr}.hide{display:none}}
</style></head><body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>String(n||0).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' so\u2019m';
const no=id=>'NM-'+(1000+Number(id)), ph=d=>{const m=/^998(\d{2})(\d{3})(\d{2})(\d{2})$/.exec(d||'');return m?`+998 ${m[1]} ${m[2]} ${m[3]} ${m[4]}`:'+'+(d||'')};
const ST={new:'New',accepted:'Accepted',on_way:'On the way',delivered:'Delivered',cancelled:'Cancelled'};
const NEXT=(o)=>o.type==='pickup'?{new:['accepted','cancelled'],accepted:['delivered','cancelled']}[o.status]||[]:{new:['accepted','cancelled'],accepted:['on_way','cancelled'],on_way:['delivered','cancelled']}[o.status]||[];
const S={pc:'all',tok:sessionStorage.getItem('noma_admin')||'',tab:'overview',f:'all',sel:null,D:null,msg:'',theme:localStorage.getItem('noma_admin_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')};
document.documentElement.dataset.theme=S.theme;
async function api(b){const r=await fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json','x-admin-token':S.tok},body:JSON.stringify(b)});let j={};try{j=await r.json()}catch(e){}if(!r.ok){const e=new Error(j.error||'error');e.code=j.error;e.status=r.status;throw e}return j}
async function load(){try{S.D=await api({action:'list'});S.msg=''}catch(e){if(e.status===401){S.tok='';sessionStorage.removeItem('noma_admin')}else S.msg='Could not load data'}draw()}
function login(){return `<div class="login"><form class="lbox" id="lf"><h1>NOMA</h1><div class="mute">Admin panel</div><input class="inp" id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus><button class="btn full">Sign in</button><div class="err" id="er">${esc(S.msg)}</div></form></div>`}
const live=o=>o.status!=='cancelled', day=d=>new Date(d).toDateString();
function overview(){const O=S.D.orders,t=day(new Date()),today=O.filter(o=>day(o.created_at)===t),rev=O.filter(live).reduce((a,o)=>a+o.total,0),ok=O.filter(live);
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return{l:d.toLocaleDateString('en',{weekday:'short'}),v:O.filter(o=>live(o)&&day(o.created_at)===d.toDateString()).reduce((a,o)=>a+o.total,0)}});const mx=Math.max(1,...days.map(d=>d.v));
 return `<div class="cards"><div class="c"><small>Orders today</small><b>${today.length}</b></div><div class="c"><small>Revenue (all time)</small><b>${money(rev)}</b></div><div class="c"><small>Average order</small><b>${money(ok.length?Math.round(rev/ok.length):0)}</b></div><div class="c"><small>Waiting for action</small><b>${O.filter(o=>o.status==='new').length}</b></div></div>
 <div class="row2"><div class="c"><small>Revenue, last 7 days</small><div class="bars">${days.map(d=>`<div><i style="height:${Math.round(d.v/mx*110)}px" title="${money(d.v)}"></i>${d.l}</div>`).join('')}</div></div>
 <div class="c"><small>Top products</small>${topSold().slice(0,5).map(p=>`<div class="dl"><span style="color:var(--ink)">${esc(p.name)}</span><span>${p.qty} pcs</span></div>`).join('')||'<div class="mute">No sales yet</div>'}</div></div>
 ${lowBlock()}<div class="hd" style="margin-top:26px"><h2 style="font-size:18px">Latest orders</h2></div>${ordersTable(O.slice(0,6))}`}
function lowBlock(){const L=(S.D.products||[]).filter(p=>p.stock!=null&&p.stock<=5&&p.active!==false).sort((a,b)=>a.stock-b.stock);return L.length?`<div class="c" style="margin-top:12px"><small>Low stock (5 or fewer)</small>${L.map(p=>`<div class="dl"><span style="color:var(--ink)">${esc(p.name.uz)}</span><span class="${p.stock?'s-new':'s-cancelled'}">${p.stock?p.stock+' left':'Sold out'}</span></div>`).join('')}</div>`:''}
function topSold(){const m={};S.D.orders.filter(live).forEach(o=>(o.items||[]).forEach(l=>{m[l.id]=m[l.id]||{name:l.name,qty:0};m[l.id].qty+=l.qty}));return Object.values(m).sort((a,b)=>b.qty-a.qty)}
function ordersTable(L){return L.length?`<div class="box"><table class="tbl"><thead><tr><th>Order</th><th>Customer</th><th class="hide">Date</th><th>Total</th><th>Status</th></tr></thead><tbody>${L.map(o=>`<tr class="k" data-o="${o.id}"><td>${no(o.id)}</td><td>${esc(o.name)}<div class="mute">${ph(o.phone)}</div></td><td class="hide mute">${new Date(o.created_at).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td>${money(o.total)}</td><td><span class="tag s-${o.status}">${ST[o.status]||esc(o.status)}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="box empty">No orders</div>'}
function orders(){const O=S.D.orders,L=S.f==='all'?O:O.filter(o=>o.status===S.f);return `<div class="chips">${['all',...Object.keys(ST)].map(k=>`<button class="chip ${S.f===k?'on':''}" data-f="${k}">${k==='all'?'All':ST[k]} ${k==='all'?O.length:O.filter(o=>o.status===k).length}</button>`).join('')}</div>${ordersTable(L)}`}
function customers(){const C=S.D.customers,cnt={};S.D.orders.forEach(o=>cnt[o.telegram_id]=(cnt[o.telegram_id]||0)+1);return C.length?`<div class="box"><table class="tbl"><thead><tr><th>Customer</th><th>Phone</th><th>Orders</th><th class="hide">Joined</th></tr></thead><tbody>${C.map(c=>`<tr><td>${esc(c.first_name||'—')}<div class="mute">${c.username?'@'+esc(c.username):''}</div></td><td>${ph(c.phone)}</td><td>${cnt[c.telegram_id]||0}</td><td class="hide mute">${new Date(c.verified_at).toLocaleDateString('en-GB')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="box empty">No customers yet</div>'}
function products(){const PA=S.D.products,P=PA&&(S.pc==='all'?PA:PA.filter(x=>x.cat===S.pc));if(!P)return `<div class="box empty">Run <code>supabase-admin.sql</code> in Supabase (SQL Editor) to manage products here.</div>`;
 return `<div class="hd" style="margin-top:-8px"><div class="chips" style="margin:0">${['all',...S.D.opts.CATS].map(k=>`<button class="chip ${S.pc===k?'on':''}" data-pc="${k}">${k==='all'?'All':k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div><button class="btn sm" data-np>+ Add product</button></div><div class="box"><table class="tbl"><thead><tr><th>Product</th><th class="hide">Category</th><th>Price</th><th>Discount</th><th>Stock</th><th>Status</th></tr></thead><tbody>${P.map(p=>`<tr class="k" data-p="${p.id}"><td>${esc(p.name.uz)}</td><td class="hide mute">${esc(p.cat)}</td><td>${money(p.price)}</td><td>${p.sale?p.sale+'%':'<span class="mute">—</span>'}</td><td>${p.stock==null?'<span class="mute">∞</span>':p.stock===0?'<span class="s-cancelled">0</span>':p.stock}</td><td><span class="tag ${p.active===false?'':'s-delivered'}">${p.active===false?'Hidden':'Active'}</span></td></tr>`).join('')}</tbody></table></div>`}
function promos(){const L=S.D.promos;return `<form class="row" id="pf2" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><input class="inp" style="width:170px;margin:0" id="pc" placeholder="CODE (e.g. WELCOME10)" maxlength="20"><input class="inp" style="width:110px;margin:0" id="pp" type="number" min="1" max="90" placeholder="% off"><button class="btn">Create promo</button><span class="err" id="pe"></span></form>${L.length?`<div class="box"><table class="tbl"><thead><tr><th>Code</th><th>Discount</th><th>Used</th><th>Status</th><th></th></tr></thead><tbody>${L.map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${x.percent}%</td><td>${x.used||0}</td><td><button class="tag ${x.active?'s-delivered':''}" data-pt="${esc(x.code)}" data-pv="${x.percent}" data-pa="${x.active?0:1}">${x.active?'Active':'Paused'}</button></td><td><button class="btn red sm" data-pd="${esc(x.code)}">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="box empty">No promo codes yet</div>'}`}
function pdrawer(){const p=S.pf,O=S.D.opts,sel=(id,L,v)=>`<select class="inp" id="${id}">${L.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
 const kind=sizeKind(p),list=O.SIZES[kind]||null,ps=!!list&&(p.ps!==undefined?p.ps:p.size_stock!=null),mt=p.mat_text||{};
 return `<div class="drawer on" id="dr"><div class="hd"><h2 style="font-size:20px">${p.id?'Edit product':'New product'}</h2><button class="btn ghost sm" data-x>Close</button></div>
 <label class="mute">Name (Uzbek)</label><input class="inp" id="pf-uz" value="${esc(p.name.uz)}" style="margin-top:4px"><label class="mute">Name (Russian)</label><input class="inp" id="pf-ru" value="${esc(p.name.ru)}" style="margin-top:4px">
 <div class="row2" style="grid-template-columns:1fr 1fr;margin-top:0"><div><label class="mute">Category</label>${sel('pf-cat',O.CATS,p.cat)}</div><div><label class="mute">Shape</label>${sel('pf-art',O.ARTS,p.art)}</div><div><label class="mute">Price (so'm)</label><input class="inp" id="pf-price" type="number" value="${p.price}"></div><div><label class="mute">Discount %</label><input class="inp" id="pf-sale" type="number" min="0" max="90" value="${p.sale||0}"></div><div><label class="mute">Stock (empty = unlimited)</label><input class="inp" id="pf-stock" type="number" min="0" value="${p.stock==null?'':p.stock}" ${ps?'disabled placeholder="sum of sizes"':''}></div><div><label class="mute">Material</label>${sel('pf-mat',O.MATS,p.mat)}</div><div><label class="mute">Section</label>${sel('pf-sub',O.SUBS,p.sub||'tops')}</div></div>
 <div class="mute">Photos (up to 3; the first one is the cover)</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px">${(p.photos||[]).map((u,i)=>`<div style="position:relative"><img src="${esc(u)}" style="width:64px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line)"><button data-ph="${i}" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg)">×</button></div>`).join('')}${(p.photos||[]).length<3?`<label class="btn ghost sm" style="align-self:center">${S.up?'Uploading…':'+ Photo'}<input type="file" accept="image/*" id="pf-file" hidden></label>`:''}</div>
 <div class="mute">Colours</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px">${Object.entries(O.COLORS).map(([h,n])=>`<button title="${esc(n)}" data-sw="${h}" style="width:30px;height:30px;border-radius:50%;background:${h};border:2px solid ${p.colors.includes(h)?'var(--ink)':'var(--line)'}"></button>`).join('')}</div>
 <label class="mute">Sizes</label><select class="inp" id="pf-sz" style="margin-top:4px">${[['none','No sizes (one size)'],['clothing','Clothing XS–XL'],['shoes','Shoes 36–46']].map(([v,l])=>`<option value="${v}" ${(Array.isArray(p.sizes)?(p.sizes[0]==='36'?'shoes':'clothing'):p.sizes===true?'clothing':p.sizes||'none')===v?'selected':''}>${l}</option>`).join('')}</select>${p.mat==='other'?`<div class="row2" style="grid-template-columns:1fr 1fr;margin-top:0"><div><label class="mute">Material text (Uzbek)</label><input class="inp" id="pf-mtu" maxlength="40" value="${esc(mt.uz||'')}"></div><div><label class="mute">Material text (Russian)</label><input class="inp" id="pf-mtr" maxlength="40" value="${esc(mt.ru||'')}"></div></div>`:''}
 ${list?`<label style="display:flex;gap:8px;margin:6px 0"><input type="checkbox" id="pf-ps" ${ps?'checked':''}> Stock for each size</label>${ps?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-bottom:10px">${list.map(s=>`<div><label class="mute">${s}</label><input class="inp szs" data-szk="${s}" type="number" min="0" placeholder="out" value="${(p.size_stock||{})[s]??''}" style="margin:2px 0 0;padding:8px"></div>`).join('')}</div><div class="mute" style="margin-bottom:8px">Empty or 0 = that size is out of stock</div>`:''}`:''}
 <label style="display:flex;gap:8px;margin:6px 0"><input type="checkbox" id="pf-act" ${p.active!==false?'checked':''}> Visible in the shop</label>
 <div class="acts"><button class="btn" data-sv>Save</button>${p.id?`<button class="btn red" data-pdel="${p.id}">Delete</button>`:''}</div><div class="err" id="de"></div></div>`}
function drawer(){if(S.pf)return pdrawer();const o=S.D&&S.D.orders.find(x=>x.id===S.sel);if(!o)return'<div class="drawer" id="dr"></div>';const A={accepted:'Accept',on_way:'On the way',delivered:o.type==='pickup'?'Handed over':'Delivered',cancelled:'Cancel'};
 return `<div class="drawer on" id="dr"><div class="hd"><h2 style="font-size:20px">${no(o.id)}</h2><button class="btn ghost sm" data-x>Close</button></div>
 <div class="dl"><span>Status</span><span class="s-${o.status}">${ST[o.status]}</span></div><div class="dl"><span>Customer</span><span>${esc(o.name)}</span></div><div class="dl"><span>Phone</span><a href="tel:+${esc(o.phone)}" style="color:inherit">${ph(o.phone)}</a></div>
 <div class="dl"><span>${o.type==='pickup'?'Pickup':'Address'}</span><span style="text-align:right">${o.type==='pickup'?'From store':esc(o.address)}</span></div>
 ${o.type!=='pickup'&&o.lat?`<div class="dl"><span>Map</span><a href="https://www.google.com/maps?q=${o.lat},${o.lon}" target="_blank" rel="noopener" style="color:inherit">Open</a></div>`:''}
 <div class="dl"><span>Payment</span><span>${esc(o.pay)}</span></div>
 <div style="margin:16px 0 4px" class="mute">Items</div>${(o.items||[]).map(l=>`<div class="dl"><span style="color:var(--ink)">${l.qty} × ${esc(l.name)}${l.size?' · '+esc(l.size):''}</span><span>${money(l.price*l.qty)}</span></div>`).join('')}
 ${o.discount?`<div class="dl"><span>Promo ${esc(o.promo)}</span><span>−${money(o.discount)}</span></div>`:''}<div class="dl"><span>Delivery</span><span>${o.delivery_fee?money(o.delivery_fee):'Free'}</span></div><div class="dl"><b>Total</b><b>${money(o.total)}</b></div>
 <div class="acts">${NEXT(o).map(s=>`<button class="btn ${s==='cancelled'?'red':''}" data-s="${s}" data-id="${o.id}">${A[s]}</button>`).join('')}</div><div class="err" id="de"></div></div>`}
function app(){const nw=S.D?S.D.orders.filter(o=>o.status==='new').length:0,T=[['overview','Overview'],['orders','Orders'],['customers','Customers'],['products','Products'],['promos','Promo codes']];
 return `<div class="app"><aside class="side"><div class="brand">NOMA</div>${T.map(([k,l])=>`<button class="nav ${S.tab===k?'on':''}" data-t="${k}">${l}${k==='orders'&&nw?`<span class="n">${nw}</span>`:''}</button>`).join('')}<div class="sp"></div><button class="nav" data-th>${S.theme==='dark'?'Light mode':'Dark mode'}</button><button class="nav" data-r>Refresh</button><button class="nav" data-out>Sign out</button></aside>
 <main class="main"><div class="hd"><h2>${T.find(x=>x[0]===S.tab)[1]}</h2></div>${S.msg?`<div class="err">${esc(S.msg)}</div>`:''}${!S.D?'<div class="mute">Loading…</div>':S.tab==='overview'?overview():S.tab==='orders'?orders():S.tab==='customers'?customers():S.tab==='promos'?promos():products()}</main></div>${drawer()}`}
function draw(){$('#root').innerHTML=S.tok?app():login();const f=$('#lf');if(f)f.onsubmit=async e=>{e.preventDefault();$('#er').textContent='';try{const r=await api({action:'login',password:$('#pw').value});S.tok=r.token;sessionStorage.setItem('noma_admin',S.tok);S.D=null;draw();load()}catch(x){$('#er').textContent=x.code==='no_admin_password'?'ADMIN_PASSWORD is not set in Vercel (add it, then Redeploy)':x.status===401?'Wrong password':x.status===404?'Server code not found: push the new files and wait for Ready':'Server error'+(x.status?' ('+x.status+')':'')}}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-t],[data-f],[data-o],[data-x],[data-s],[data-th],[data-r],[data-out]');if(!b)return;const d=b.dataset;
 if(d.t){S.tab=d.t;S.sel=null;S.pf=null;draw()}else if(d.f){S.f=d.f;draw()}else if(d.o){S.sel=+d.o;draw()}else if('x' in d){S.sel=null;draw()}
 else if('th' in d){S.theme=S.theme==='dark'?'light':'dark';localStorage.setItem('noma_admin_theme',S.theme);document.documentElement.dataset.theme=S.theme;draw()}
 else if('r' in d)load();else if('out' in d){S.tok='';S.D=null;sessionStorage.removeItem('noma_admin');draw()}
 else if(d.s){b.disabled=true;try{await api({action:'status',id:+d.id,status:d.s});await load()}catch(x){b.disabled=false;const el=$('#de');if(el)el.textContent=x.code==='bad_transition'||x.code==='changed'?'Status already changed. Refreshing…':'Could not update';if(x.status===409)load()}}});
const sizeKind=p=>Array.isArray(p.sizes)?(p.sizes[0]==='36'?'shoes':'clothing'):p.sizes===true?'clothing':p.sizes||'none';
function grab(){const p=S.pf;p.name={uz:$('#pf-uz').value,ru:$('#pf-ru').value};p.price=$('#pf-price').value;p.sale=$('#pf-sale').value;p.stock=$('#pf-stock').value;p.cat=$('#pf-cat').value;p.art=$('#pf-art').value;p.mat=$('#pf-mat').value;p.sub=$('#pf-sub').value;p.sizes=$('#pf-sz').value;if($('#pf-ps'))p.ps=$('#pf-ps').checked;if($('#pf-mtu'))p.mat_text={uz:$('#pf-mtu').value,ru:$('#pf-mtr').value};
 const szs=[...document.querySelectorAll('.szs')];if(szs.length){p.size_stock={};szs.forEach(i=>p.size_stock[i.dataset.szk]=i.value)};p.active=$('#pf-act').checked}
const blank={name:{uz:'',ru:''},cat:'women',art:'tee',mat:'cotton',price:100000,sale:0,stock:null,active:true,sizes:'clothing',colors:['#181818'],sub:'tops',photos:[]};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-np],[data-p],[data-pc],[data-ph],[data-sw],[data-sv],[data-pdel],[data-pt],[data-pd],[data-x]');if(!b)return;const d=b.dataset,E=m=>{const el=$('#de');if(el)el.textContent=m};
 if('np' in d){S.sel=null;S.pf=JSON.parse(JSON.stringify(blank));draw()}else if(d.p){S.sel=null;S.pf=JSON.parse(JSON.stringify(S.D.products.find(x=>x.id==d.p)));S.pf.photos=S.pf.photos||[];draw()}
 else if('x' in d){S.pf=null;draw()}
 else if(d.pc){S.pc=d.pc;draw()}
 else if(d.ph){grab();S.pf.photos.splice(+d.ph,1);draw()}
 else if(d.sw){const c=S.pf.colors,i=c.indexOf(d.sw);i>=0?c.length>1&&c.splice(i,1):c.push(d.sw);grab();draw()}
 else if('sv' in d){grab();const p=S.pf;b.disabled=true;try{await api({action:'product_save',product:{id:p.id,name:{uz:$('#pf-uz').value,ru:$('#pf-ru').value},cat:$('#pf-cat').value,art:$('#pf-art').value,mat:$('#pf-mat').value,price:$('#pf-price').value,sale:$('#pf-sale').value||0,stock:$('#pf-stock').value,active:$('#pf-act').checked,sizes:$('#pf-sz').value,size_stock:(p.ps!==false&&sizeKind(p)!=='none'&&p.size_stock)?p.size_stock:null,mat_text:p.mat_text,colors:p.colors,sub:$('#pf-sub').value,photos:p.photos||[]}});S.pf=null;await load()}catch(x){b.disabled=false;E('Check the fields: names, price (min 1 000), discount 0–90, stock')}}
 else if(d.pdel){if(confirm('Delete this product?')){try{await api({action:'product_delete',id:+d.pdel});S.pf=null;await load()}catch(x){E('Could not delete')}}}
 else if(d.pt){try{await api({action:'promo_save',code:d.pt,percent:+d.pv,active:d.pa==='1'});await load()}catch(x){}}
 else if(d.pd){if(confirm('Delete promo code '+d.pd+'?')){try{await api({action:'promo_delete',code:d.pd});await load()}catch(x){}}}});
function shrink(file){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);ok(cv.toDataURL('image/jpeg',.82).split(',')[1])};im.onerror=no;im.src=u})}
document.addEventListener('change',async e=>{if(['pf-sz','pf-mat','pf-ps'].includes(e.target.id)&&S.pf){grab();if(e.target.id==='pf-ps'&&!S.pf.ps)S.pf.size_stock=null;draw();return}if(e.target.id!=='pf-file'||!e.target.files[0])return;grab();S.up=true;draw();try{const r=await api({action:'photo_upload',data:await shrink(e.target.files[0])});S.pf.photos=[...(S.pf.photos||[]),r.url]}catch(x){S.up=false;draw();const el=$('#de');if(el)el.textContent=x.code==='upload_failed'?'Upload failed: run supabase-update.sql (storage bucket), then try again':'Could not read this image';return}S.up=false;draw()});
document.addEventListener('submit',async e=>{if(e.target.id!=='pf2')return;e.preventDefault();try{await api({action:'promo_save',code:$('#pc').value,percent:+$('#pp').value,active:true});await load()}catch(x){$('#pe').textContent='Code: letters/numbers, % from 1 to 90'}});
setInterval(()=>{if(S.tok&&S.D&&!S.sel&&!S.pf&&!document.hidden)load()},30000);
draw();if(S.tok)load();
</script></body></html>
