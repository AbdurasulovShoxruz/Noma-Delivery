<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOMA Admin</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--card:#fff;--ink:#181818;--mute:#78746b;--line:#E6E2D8;--tile:#EEEAE0;--ok:#1d6b3a;--warn:#9a6a00;--bad:#B3261E;--sans:'Jost',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
[data-theme=dark]{--bg:#121212;--card:#1A1A19;--ink:#F2EFE8;--mute:#9a968c;--line:#2A2A28;--tile:#222221;--ok:#5fc084;--warn:#e0b04a;--bad:#ef7b73}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}input{font:inherit;color:inherit}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:100%;max-width:340px;text-align:center}.lbox h1{font-weight:500;letter-spacing:.3em;font-size:22px;margin:0 0 6px}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;margin:18px 0 10px;outline:none}.inp:focus{border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-weight:500}
.btn.full{width:100%;padding:13px}.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:7px 13px;font-size:13px}.btn.red{background:none;color:var(--bad);border:1px solid var(--line)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}.mute{color:var(--mute)}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:500;letter-spacing:.3em;font-size:16px;padding:0 10px 18px}
.nav{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;color:var(--mute);text-align:left;width:100%}
.nav.on{background:var(--tile);color:var(--ink)}.nav .n{margin-left:auto;font-size:12px;background:var(--ink);color:var(--bg);border-radius:999px;padding:0 7px}
.sp{flex:1}.main{padding:26px 30px 60px;max-width:1100px;width:100%}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.hd h2{margin:0;font-weight:500;font-size:24px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.c small{color:var(--mute);display:block;margin-bottom:6px}.c b{font-size:24px;font-weight:500}
.row2{display:grid;grid-template-columns:3fr 2fr;gap:12px;margin-top:12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:14px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.bars i{display:block;background:var(--ink);border-radius:6px 6px 0 0;min-height:2px;margin-bottom:6px}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;font-weight:400;color:var(--mute);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line)}.tbl tr.k{cursor:pointer}.tbl tr.k:hover td{background:var(--tile)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12px}
.s-new{color:var(--warn)}.s-accepted,.s-on_way{color:var(--ink)}.s-delivered{color:var(--ok)}.s-cancelled{color:var(--bad)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--card);border-left:1px solid var(--line);padding:22px;overflow:auto;transform:translateX(105%);transition:transform .22s;z-index:30}
.drawer.on{transform:none}.dl{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}.dl span:first-child{color:var(--mute)}
.acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.empty{padding:40px;text-align:center;color:var(--mute)}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px;align-items:center}.brand{padding:0 10px}.nav{width:auto;white-space:nowrap}.sp{display:none}
.main{padding:18px 14px 60px}.cards{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr}.hide{display:none}}
</style></head><body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>String(n||0).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' so\u2019m';
const no=id=>'NM-'+(1000+Number(id)), ph=d=>{const m=/^998(\d{2})(\d{3})(\d{2})(\d{2})$/.exec(d||'');return m?`+998 ${m[1]} ${m[2]} ${m[3]} ${m[4]}`:'+'+(d||'')};
const ST={new:'New',accepted:'Accepted',on_way:'On the way',delivered:'Delivered',cancelled:'Cancelled'};
const NEXT=(o)=>o.type==='pickup'?{new:['accepted','cancelled'],accepted:['delivered','cancelled']}[o.status]||[]:{new:['accepted','cancelled'],accepted:['on_way','cancelled'],on_way:['delivered','cancelled']}[o.status]||[];
const S={tok:sessionStorage.getItem('noma_admin')||'',tab:'overview',f:'all',sel:null,D:null,msg:'',theme:localStorage.getItem('noma_admin_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')};
document.documentElement.dataset.theme=S.theme;
async function api(b){const r=await fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json','x-admin-token':S.tok},body:JSON.stringify(b)});let j={};try{j=await r.json()}catch(e){}if(!r.ok){const e=new Error(j.error||'error');e.code=j.error;e.status=r.status;throw e}return j}
async function load(){try{S.D=await api({action:'list'});S.msg=''}catch(e){if(e.status===401){S.tok='';sessionStorage.removeItem('noma_admin')}else S.msg='Could not load data'}draw()}
function login(){return `<div class="login"><form class="lbox" id="lf"><h1>NOMA</h1><div class="mute">Admin panel</div><input class="inp" id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus><button class="btn full">Sign in</button><div class="err" id="er">${esc(S.msg)}</div></form></div>`}
const live=o=>o.status!=='cancelled', day=d=>new Date(d).toDateString();
function overview(){const O=S.D.orders,t=day(new Date()),today=O.filter(o=>day(o.created_at)===t),rev=O.filter(live).reduce((a,o)=>a+o.total,0),ok=O.filter(live);
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return{l:d.toLocaleDateString('en',{weekday:'short'}),v:O.filter(o=>live(o)&&day(o.created_at)===d.toDateString()).reduce((a,o)=>a+o.total,0)}});const mx=Math.max(1,...days.map(d=>d.v));
 return `<div class="cards"><div class="c"><small>Orders today</small><b>${today.length}</b></div><div class="c"><small>Revenue (all time)</small><b>${money(rev)}</b></div><div class="c"><small>Average order</small><b>${money(ok.length?Math.round(rev/ok.length):0)}</b></div><div class="c"><small>Waiting for action</small><b>${O.filter(o=>o.status==='new').length}</b></div></div>
 <div class="row2"><div class="c"><small>Revenue, last 7 days</small><div class="bars">${days.map(d=>`<div><i style="height:${Math.round(d.v/mx*110)}px" title="${money(d.v)}"></i>${d.l}</div>`).join('')}</div></div>
 <div class="c"><small>Top products</small>${top().slice(0,5).map(p=>`<div class="dl"><span style="color:var(--ink)">${esc(p.name)}</span><span>${p.qty} pcs</span></div>`).join('')||'<div class="mute">No sales yet</div>'}</div></div>
 <div class="hd" style="margin-top:26px"><h2 style="font-size:18px">Latest orders</h2></div>${ordersTable(O.slice(0,6))}`}
function top(){const m={};S.D.orders.filter(live).forEach(o=>(o.items||[]).forEach(l=>{m[l.id]=m[l.id]||{name:l.name,qty:0};m[l.id].qty+=l.qty}));return Object.values(m).sort((a,b)=>b.qty-a.qty)}
function ordersTable(L){return L.length?`<div class="box"><table class="tbl"><thead><tr><th>Order</th><th>Customer</th><th class="hide">Date</th><th>Total</th><th>Status</th></tr></thead><tbody>${L.map(o=>`<tr class="k" data-o="${o.id}"><td>${no(o.id)}</td><td>${esc(o.name)}<div class="mute">${ph(o.phone)}</div></td><td class="hide mute">${new Date(o.created_at).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td>${money(o.total)}</td><td><span class="tag s-${o.status}">${ST[o.status]||esc(o.status)}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="box empty">No orders</div>'}
function orders(){const O=S.D.orders,L=S.f==='all'?O:O.filter(o=>o.status===S.f);return `<div class="chips">${['all',...Object.keys(ST)].map(k=>`<button class="chip ${S.f===k?'on':''}" data-f="${k}">${k==='all'?'All':ST[k]} ${k==='all'?O.length:O.filter(o=>o.status===k).length}</button>`).join('')}</div>${ordersTable(L)}`}
function customers(){const C=S.D.customers,cnt={};S.D.orders.forEach(o=>cnt[o.telegram_id]=(cnt[o.telegram_id]||0)+1);return C.length?`<div class="box"><table class="tbl"><thead><tr><th>Customer</th><th>Phone</th><th>Orders</th><th class="hide">Joined</th></tr></thead><tbody>${C.map(c=>`<tr><td>${esc(c.first_name||'—')}<div class="mute">${c.username?'@'+esc(c.username):''}</div></td><td>${ph(c.phone)}</td><td>${cnt[c.telegram_id]||0}</td><td class="hide mute">${new Date(c.verified_at).toLocaleDateString('en-GB')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="box empty">No customers yet</div>'}
function products(){const sold={};top().forEach(p=>sold[p.name]=p.qty);return `<div class="box"><table class="tbl"><thead><tr><th>Product</th><th>Price</th><th>Sold</th></tr></thead><tbody>${S.D.catalog.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${sold[p.name]||0}</td></tr>`).join('')}</tbody></table></div><p class="mute">Products are edited in <code>lib/catalog.js</code> and <code>index.html</code>.</p>`}
function drawer(){const o=S.D&&S.D.orders.find(x=>x.id===S.sel);if(!o)return'<div class="drawer" id="dr"></div>';const A={accepted:'Accept',on_way:'On the way',delivered:o.type==='pickup'?'Handed over':'Delivered',cancelled:'Cancel'};
 return `<div class="drawer on" id="dr"><div class="hd"><h2 style="font-size:20px">${no(o.id)}</h2><button class="btn ghost sm" data-x>Close</button></div>
 <div class="dl"><span>Status</span><span class="s-${o.status}">${ST[o.status]}</span></div><div class="dl"><span>Customer</span><span>${esc(o.name)}</span></div><div class="dl"><span>Phone</span><a href="tel:+${esc(o.phone)}" style="color:inherit">${ph(o.phone)}</a></div>
 <div class="dl"><span>${o.type==='pickup'?'Pickup':'Address'}</span><span style="text-align:right">${o.type==='pickup'?'From store':esc(o.address)}</span></div>
 ${o.type!=='pickup'&&o.lat?`<div class="dl"><span>Map</span><a href="https://www.google.com/maps?q=${o.lat},${o.lon}" target="_blank" rel="noopener" style="color:inherit">Open</a></div>`:''}
 <div class="dl"><span>Payment</span><span>${esc(o.pay)}</span></div>
 <div style="margin:16px 0 4px" class="mute">Items</div>${(o.items||[]).map(l=>`<div class="dl"><span style="color:var(--ink)">${l.qty} × ${esc(l.name)}${l.size?' · '+esc(l.size):''}</span><span>${money(l.price*l.qty)}</span></div>`).join('')}
 <div class="dl"><span>Delivery</span><span>${o.delivery_fee?money(o.delivery_fee):'Free'}</span></div><div class="dl"><b>Total</b><b>${money(o.total)}</b></div>
 <div class="acts">${NEXT(o).map(s=>`<button class="btn ${s==='cancelled'?'red':''}" data-s="${s}" data-id="${o.id}">${A[s]}</button>`).join('')}</div><div class="err" id="de"></div></div>`}
function app(){const nw=S.D?S.D.orders.filter(o=>o.status==='new').length:0,T=[['overview','Overview'],['orders','Orders'],['customers','Customers'],['products','Products']];
 return `<div class="app"><aside class="side"><div class="brand">NOMA</div>${T.map(([k,l])=>`<button class="nav ${S.tab===k?'on':''}" data-t="${k}">${l}${k==='orders'&&nw?`<span class="n">${nw}</span>`:''}</button>`).join('')}<div class="sp"></div><button class="nav" data-th>${S.theme==='dark'?'Light mode':'Dark mode'}</button><button class="nav" data-r>Refresh</button><button class="nav" data-out>Sign out</button></aside>
 <main class="main"><div class="hd"><h2>${T.find(x=>x[0]===S.tab)[1]}</h2></div>${S.msg?`<div class="err">${esc(S.msg)}</div>`:''}${!S.D?'<div class="mute">Loading…</div>':S.tab==='overview'?overview():S.tab==='orders'?orders():S.tab==='customers'?customers():products()}</main></div>${drawer()}`}
function draw(){$('#root').innerHTML=S.tok?app():login();const f=$('#lf');if(f)f.onsubmit=async e=>{e.preventDefault();$('#er').textContent='';try{const r=await api({action:'login',password:$('#pw').value});S.tok=r.token;sessionStorage.setItem('noma_admin',S.tok);S.D=null;draw();load()}catch(x){$('#er').textContent=x.code==='no_admin_password'?'ADMIN_PASSWORD is not set in Vercel (add it, then Redeploy)':x.status===401?'Wrong password':x.status===404?'Server code not found: push the new files and wait for Ready':'Server error'+(x.status?' ('+x.status+')':'')}}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-t],[data-f],[data-o],[data-x],[data-s],[data-th],[data-r],[data-out]');if(!b)return;const d=b.dataset;
 if(d.t){S.tab=d.t;S.sel=null;draw()}else if(d.f){S.f=d.f;draw()}else if(d.o){S.sel=+d.o;draw()}else if('x' in d){S.sel=null;draw()}
 else if('th' in d){S.theme=S.theme==='dark'?'light':'dark';localStorage.setItem('noma_admin_theme',S.theme);document.documentElement.dataset.theme=S.theme;draw()}
 else if('r' in d)load();else if('out' in d){S.tok='';S.D=null;sessionStorage.removeItem('noma_admin');draw()}
 else if(d.s){b.disabled=true;try{await api({action:'status',id:+d.id,status:d.s});await load()}catch(x){b.disabled=false;const el=$('#de');if(el)el.textContent=x.code==='bad_transition'||x.code==='changed'?'Status already changed. Refreshing…':'Could not update';if(x.status===409)load()}}});
setInterval(()=>{if(S.tok&&S.D&&!S.sel&&!document.hidden)load()},30000);
draw();if(S.tok)load();
</script></body></html>
