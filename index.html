<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F7F5F0">
<title>NOMA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F0; --ink:#181818; --mute:#78746b; --line:#E6E2D8;
  --tile:#EEEAE0; --card:#FFFFFF; --r:12px; --ok:#1d6b3a;
  --sans:'Jost',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
}
[data-theme=dark]{--bg:#121212;--ink:#F2EFE8;--mute:#9a968c;--line:#2A2A28;--tile:#1E1E1D;--card:#1A1A19;--ok:#5fc084}
[data-theme=dark] .logo img{filter:invert(1);mix-blend-mode:screen}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:15px;line-height:1.45}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:0 20px 120px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 20px;max-width:520px;margin:0 auto}
.logo{display:block;line-height:0}
.logo img{height:19px;width:auto;mix-blend-mode:multiply}
.langs{display:flex;gap:10px;font-size:12px;letter-spacing:.08em;color:var(--mute)}
.langs button{padding:4px 0;color:var(--mute)}
.langs button.on{color:var(--ink);border-bottom:1px solid var(--ink)}
.bagbtn{justify-self:end;position:relative;width:40px;height:40px;display:grid;place-items:center}
.bagbtn svg{width:22px;height:22px}
.badge[hidden]{display:none}
.badge{position:absolute;top:2px;right:0;min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--bg);
  font-size:11px;display:grid;place-items:center;padding:0 5px}
.backrow{padding:4px 0 12px}
.link{font-size:13px;color:var(--mute);letter-spacing:.04em}

/* hero */
.hero{background:var(--tile);border-radius:var(--r);padding:34px 24px 26px;margin-top:8px}
.kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.hero h1{font-family:var(--serif);font-weight:500;font-style:italic;font-size:44px;line-height:1.02;margin:14px 0 12px;letter-spacing:-.01em}
.hero p{margin:0 0 22px;color:var(--mute);max-width:280px}

/* pills */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--bg);
  border-radius:999px;padding:13px 26px;font-size:14px;font-weight:500;letter-spacing:.04em;transition:transform .12s,opacity .12s}
.pill:active{transform:scale(.97);opacity:.9}
.pill.full{width:100%;padding:16px 26px;font-size:15px}
.pill.sm{padding:9px 16px;font-size:12px}
.pill.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.pill[disabled]{opacity:.35}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:26px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:13px;background:transparent;letter-spacing:.03em}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 14px;margin-top:18px}
.card{display:flex;flex-direction:column;gap:10px;text-align:left}
.art{background:var(--tile);border-radius:var(--r);aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden;position:relative}
.art svg{width:74%;height:auto}
.art img{width:100%;height:100%;object-fit:cover}
.card .nm{font-size:14px;line-height:1.3}
.card .pr{font-size:13px;color:var(--mute);margin-top:-6px}
.card .pill{align-self:flex-start}

/* product page */
.pdp .art{aspect-ratio:1/1.1}
.pdp h2{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.05;margin:22px 0 4px}
.price{font-size:17px}
.label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:24px 0 10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-width:48px;height:44px;border:1px solid var(--line);border-radius:999px;padding:0 16px;font-size:13px}
.opt.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.sw{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);position:relative}
.sw.on::after{content:"";position:absolute;inset:-5px;border:1px solid var(--ink);border-radius:50%}
.muted{color:var(--mute)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dock>*{max-width:480px;margin:0 auto;display:flex}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(24,24,24,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:20px 20px 0 0;
  padding:12px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-width:520px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 18px}
.srow{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.srow .art{width:76px;aspect-ratio:4/5;flex:none}
.srow .art svg{width:70%}

/* bag */
.line{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.line .art{width:84px;flex:none}
.line .art svg{width:68%}
.line .info{flex:1;display:flex;flex-direction:column;gap:3px}
.qty{display:inline-flex;align-items:center;gap:14px;margin-top:8px;border:1px solid var(--line);border-radius:999px;padding:3px 6px;align-self:flex-start}
.qty button{width:28px;height:28px;font-size:18px;line-height:1}
.sum{padding:18px 0 4px}
.sum div{display:flex;justify-content:space-between;padding:5px 0}
.sum .tot{font-size:18px;border-top:1px solid var(--ink);margin-top:10px;padding-top:14px}

/* forms */
.panel{background:var(--card);border-radius:var(--r);padding:18px;margin-top:14px}
.field{display:block;margin-top:16px}
.field:first-child{margin-top:0}
.field span{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.inp{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 0;font-size:16px;outline:none;border-radius:0}
.inp:focus{border-bottom-color:var(--ink)}
.inp.err{border-bottom-color:#B3261E}
.phone{display:flex;align-items:center;gap:8px}
.phone b{font-weight:400;font-size:16px}
.choice{display:flex;gap:10px}
.choice button{flex:1;border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-align:left;background:var(--card)}
.choice button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.choice small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.pay{display:flex;flex-direction:column;gap:8px}
.pay button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--card);text-align:left}
.pay button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot{width:16px;height:16px;border-radius:50%;border:1px solid var(--mute);flex:none}
.on .dot{border:5px solid var(--ink)}
.tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--mute);margin-left:8px}
.errtxt{color:#B3261E;font-size:12px;margin-top:6px}

/* done */
.done{text-align:center;padding-top:36px}
.tick{width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;margin:0 auto 20px}
.done h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:36px;margin:0 0 6px}
.owner{background:var(--card);border-radius:var(--r);padding:16px;text-align:left;margin-top:26px;font-size:14px;border:1px solid var(--line)}
.owner .hd{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.owner pre{margin:0;font:inherit;white-space:pre-wrap}
.owner .btns{display:flex;gap:8px;margin-top:12px}
.owner .btns span{flex:1;text-align:center;background:var(--tile);border-radius:8px;padding:9px;font-size:13px}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;
  font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:80;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:70px 0}
.empty h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:34px;margin:0 0 8px}
.map-wrap{position:relative;isolation:isolate;border-radius:var(--r);overflow:hidden;height:280px;border:1px solid var(--line);margin-top:2px}
#map{position:absolute;inset:0;background:var(--tile)}
.maperr{padding:24px;color:var(--mute);font-size:13px}
.pin{position:absolute;left:50%;top:50%;width:30px;height:40px;transform:translate(-50%,-100%);pointer-events:none;z-index:1000}
.pin svg{width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.vphone{font-size:16px;padding:8px 0;border-bottom:1px solid var(--line)}
.field span.tag{display:inline-block;margin:0 0 0 10px;padding:2px 8px;letter-spacing:.12em;font-size:10px;color:#1d6b3a;border:1px solid #bfdcc9;border-radius:999px;vertical-align:middle}
.banner{background:var(--tile);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--mute);margin-top:6px;text-align:center}
.leaflet-container{font-family:var(--sans);font-size:11px}
.small{font-size:12px}
.lft,.rgt{display:flex;align-items:center;gap:6px}.rgt{justify-self:end}
.ib{position:relative;width:36px;height:36px;display:grid;place-items:center}.ib svg{width:20px;height:20px}
.hrt{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--bg) 80%,transparent);display:grid;place-items:center;z-index:2}
.hrt svg{width:18px;height:18px}.hrt.on svg{fill:var(--ink)}
.card{position:relative}.pdp .art{position:relative}
.ship{margin:14px 0 4px;font-size:13px}.bar{height:3px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
.ltot{font-size:13px;color:var(--mute)}.row{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.irow{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.irow span:first-child{color:var(--mute)}
#smap{height:200px;border-radius:var(--r);border:1px solid var(--line);margin-top:18px;overflow:hidden;position:relative;isolation:isolate}
.hero .pill+.pill{margin-left:8px}.foot{margin-top:34px;text-align:center}
.tools{display:flex;gap:10px;margin-top:14px}.tools .inp{border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:14px;background:var(--card)}.tools .inp:first-child{flex:1;min-width:0}.tools select{width:auto;max-width:46%}
.pr s{color:var(--mute);opacity:.7;margin-right:4px}.off{position:absolute;left:8px;top:8px;z-index:2;font-size:11px;background:var(--ink);color:var(--bg);border-radius:999px;padding:2px 9px}
.promo{display:flex;gap:10px;align-items:center;margin-top:16px}.promo .inp{flex:1;text-transform:uppercase;font-size:14px}
</style>
</head>

function bindForm(){
  const n=$('#f-name'), ph=$('#f-phone'), d=$('#f-district'), a=$('#f-address');
  if(n) n.oninput=()=>{S.co.name=n.value; S.err.name=0;};
  if(ph) ph.oninput=()=>{ S.co.phone=ph.value.replace(/\D/g,'').slice(0,9); ph.value=fmtPhone(S.co.phone); S.err.phone=0; };
  if(d) d.onchange=()=>{S.co.district=d.value; S.err.district=0;};
  if(a) a.oninput=()=>{S.co.address=a.value; S.err.address=0; S.addrAuto=false;};

async function place(){
  if(S.busy) return;
  const c=S.co, e={};
  if(!c.name.trim()) e.name=1;
  if(!S.live && c.phone.length!==9) e.phone=1;
  if(c.type==='courier'){
    if(!c.address.trim()) e.address=1;
    if(!c.pin) e.pin=1; else if(!inZone(c.lat,c.lon)) e.zone=1;
  }
  S.err=e;
  if(Object.keys(e).length){
    render(); haptic('heavy');
    const z=document.getElementById('zone');
    const el=document.querySelector('.err')||(z&&z.style.display!=='none'?z:null);
    if(el) el.scrollIntoView({block:'center',behavior:'smooth'});
    return;
  }
  if(S.live){
    S.busy=true; render();
    try{
      const r=await api('/api/order',{initData:tg.initData,
        items:S.bag.map(l=>({id:l.id,size:l.size,color:l.color,qty:l.qty})),
        type:c.type,promo:S.promo?S.promo.code:undefined,lat:c.lat,lon:c.lon,address:c.address.trim(),pay:c.pay,name:c.name.trim(),lang:S.lang});
      S.order={live:true,no:r.no,total:r.total};
      S.bag=[]; S.promo=null; save(); S.busy=false; S.nav=['home','done']; render(); window.scrollTo(0,0);
      try{ tg.HapticFeedback.notificationOccurred('success'); }catch(x){}
    }catch(err){
      S.busy=false;
      const code=err.json&&err.json.error;
      if(code==='not_verified'){ S.verified=false; S.nav=['verify']; render(); return; }
      if(code==='bad_promo') S.promo=null;
      render(); toast(code==='outside_zone'?t('outsideZone'):code==='out_of_stock'?t('outOfStock'):code==='bad_promo'?t('badPromo'):t('errGeneric'));
    }
    return;
  }
  const total=subtotal()+shipFee();
  S.order={no:'NM-'+(1000+Math.floor(Math.random()*9000)),name:c.name.trim(),phone:c.phone,type:c.type,address:c.address.trim(),pay:c.pay,items:S.bag.slice(),total};
  S.bag=[]; save(); S.nav=['home','done']; render(); window.scrollTo(0,0); haptic('heavy');
  try{ tg.HapticFeedback.notificationOccurred('success'); }catch(x){}
}

/* ---------- Backend ---------- */
async function api(path, body){
  const r = await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok){ const err=new Error('api'); err.status=r.status; err.json=j; throw err; }
  return j;
}
async function loadShop(){
  try{
    const r=await fetch('/api/shop'), j=await r.json();
    if(j.products && j.products.length){
      P.length=0;
      j.products.forEach(x=>P.push({id:x.id,cat:x.cat,art:x.art,mat:x.mat,price:x.price,old:x.old,stock:x.stock,sub:x.sub,photos:x.photos,sizes:x.sizes,colors:x.colors,name:{uz:x.name.uz,ru:x.name.ru,en:x.name.uz}}));
      S.bag=S.bag.filter(l=>pById(l.id)); save();
    }
  }catch(e){}
}
async function init(){
  await loadShop();
  if(inTG){
    try{
      const r=await api('/api/me',{initData:tg.initData});
      S.live=true; S.verified=!!r.verified; S.phone=r.phone||''; S.bot=r.bot||'';
    }catch(e){ S.live=false; S.demoNote=true; }

  render();
}

/* ---------- Delivery map (OpenStreetMap + Leaflet) ---------- */
const TASH={lat:41.2995,lon:69.2401};
const ZONE={latMin:41.15,latMax:41.47,lonMin:69.08,lonMax:69.45};
const inZone=(la,lo)=>la>=ZONE.latMin&&la<=ZONE.latMax&&lo>=ZONE.lonMin&&lo<=ZONE.lonMax;
function initMap(){
  const el=document.getElementById('map'); if(!el) return;
  if(!window.L){ el.innerHTML='<div class="maperr">Map unavailable</div>'; return; }
  const has=S.co.lat!=null;
  const map=L.map(el,{scrollWheelZoom:'center',touchZoom:'center',doubleClickZoom:'center'})
    .setView(has?[S.co.lat,S.co.lon]:[TASH.lat,TASH.lon], has?17:12);
  map.attributionControl.setPrefix(false);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
  map.on('dragend',()=>{ const c=map.getCenter(); setPin(c.lat,c.lng,false); });
  S.map=map; zoneNote();
}
function setPin(la,lo,recenter){
  S.co.lat=+la.toFixed(6); S.co.lon=+lo.toFixed(6); S.co.pin=true; S.err.pin=0; S.err.zone=0;
  if(recenter&&S.map) S.map.setView([la,lo],17);
  zoneNote(); reverse(la,lo);
}
function zoneNote(){
  const n=document.getElementById('zone'); if(!n) return;
  const out=S.co.pin&&!inZone(S.co.lat,S.co.lon);
  if(out||S.err.zone){ n.textContent=t('outsideZone'); n.style.display='block'; }
  else if(S.err.pin){ n.textContent=t('pinRequired'); n.style.display='block'; }
  else n.style.display='none';
}
let geoT;
function reverse(la,lo){
  clearTimeout(geoT);
  geoT=setTimeout(async()=>{
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&lat=${la}&lon=${lo}&accept-language=${S.lang}`);
      const j=await r.json(), a=j.address||{};
      const street=[a.road||a.pedestrian||a.footway, a.house_number].filter(Boolean).join(' ');
      const txt=[street, a.suburb||a.neighbourhood||a.city_district||''].filter(Boolean).join(', ');
      if(txt && S.addrAuto){ S.co.address=txt; S.err.address=0; const f=document.getElementById('f-address'); if(f){ f.value=txt; f.classList.remove('err'); const nx=f.nextElementSibling; if(nx&&nx.classList.contains('errtxt')) nx.remove(); } }
    }catch(e){}
  },700);
}
function locate(){
  const fallback=()=>{
    if(!navigator.geolocation){ toast(t('locDenied')); return; }
    toast(t('locating'));
    navigator.geolocation.getCurrentPosition(p=>setPin(p.coords.latitude,p.coords.longitude,true),()=>toast(t('locDenied')),{enableHighAccuracy:true,timeout:10000});
  };
  try{
    if(tg && tg.LocationManager && tg.isVersionAtLeast('8.0')){
      const lm=tg.LocationManager;
      const get=()=>lm.getLocation(loc=>{ if(loc && loc.latitude!=null) setPin(loc.latitude,loc.longitude,true); else fallback(); });
      if(lm.isInited) get(); else lm.init(get);
      return;
    }
  }catch(e){}
  fallback();
}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]'); 
  if(ev.target.id==='scrim'){ closeSheet(); return; }
  if(!b) return;
  const a=b.dataset.a, v=b.dataset.v;
  switch(a){
    case 'lang': S.lang=v; try{localStorage.setItem('noma_lang',v);}catch(e){} render(); if(S.sheet) drawSheet(); break;
    case 'cat': S.cat=v; S.sub='all'; render(); break;
    case 'sub': S.sub=v; render(); break;
    case 'sizes': go('sizes'); break;
    case 'orders': api('/api/orders',{initData:tg.initData}).then(r=>{ S.myOrders=r.orders; go('orders'); }).catch(()=>toast(t('errGeneric'))); break;
    case 'shop': document.getElementById('shop').scrollIntoView({behavior:'smooth'}); break;
    case 'open': S.pid=+v; S.sel={size:null,color:0}; haptic(); go('pdp'); break;
    case 'quick': openSheet(+v); break;
    case 'scolor': S.sheet.color=+v; drawSheet(); break;
    case 'ssize': S.sheet.size=v; drawSheet(); break;
    case 'sadd': { const p=pById(S.sheet.id); addLine(p.id,p.sizes?S.sheet.size:null,S.sheet.color); closeSheet(); break; }
    case 'color': S.sel.color=+v; render(); break;
    case 'size': S.sel.size=v; render(); break;
    case 'addpdp': { const p=pById(S.pid); if(p.sizes&&!S.sel.size){ toast(t('size')+'?'); haptic('heavy'); break; } addLine(p.id,p.sizes?S.sel.size:null,S.sel.color); break; }
    case 'back': back(); break;
    case 'home': S.nav=['home']; render(); window.scrollTo(0,0); break;
    case 'inc': S.bag[+v].qty++; save(); render(); break;
    case 'dec': if(S.bag[+v].qty>1) S.bag[+v].qty--; else S.bag.splice(+v,1); save(); render(); break;
    case 'del': S.bag.splice(+v,1); save(); render(); break;
    case 'tocheckout': S.err={}; go('checkout'); break;
    case 'type': S.co.type=v; render(); break;
    case 'pay': S.co.pay=v; render(); break;
    case 'share': shareNumber(); break;
    case 'recheck': pollVerified(); break;
    case 'locate': locate(); break;
    case 'fav': toggleFav(+v); render(); break;
    case 'favline': toggleFav(+v); render(); toast(t('favs')); break;
    case 'store': go('store'); break;
    case 'applypromo': { const el=$('#f-promo'); const code=el&&el.value.trim(); if(!code) break;
      api('/api/promo',{initData:tg.initData,code}).then(r=>{ S.promo={code:r.code,percent:r.percent}; render(); haptic('medium'); }).catch(()=>{ toast(t('badPromo')); haptic('heavy'); }); break; }
    case 'rmpromo': S.promo=null; render(); break;
    case 'openmap': { const u=`https://www.google.com/maps?q=${STORE.lat},${STORE.lon}`; try{ tg.openLink(u); }catch(e){ window.open(u,'_blank'); } break; }
    case 'place': place(); break;
  }
});
$('#bagbtn').addEventListener('click',()=>{ const v=curView(); if(v!=='verify'&&v!=='bag'&&v!=='checkout'&&v!=='done'){ closeSheet(); go('bag'); } });
document.addEventListener('input',ev=>{ if(ev.target.id==='f-q'){ S.q=ev.target.value; const g=$('#grid'); if(g) g.innerHTML=gridHtml(); } });
document.addEventListener('change',ev=>{ if(ev.target.id==='f-sort'){ S.sort=ev.target.value; const g=$('#grid'); if(g) g.innerHTML=gridHtml(); } });
$('#themebtn').addEventListener('click',()=>{ S.theme=S.theme==='dark'?'light':'dark'; try{localStorage.setItem('noma_theme',S.theme);}catch(e){} applyTheme(); haptic(); });
$('#favbtn').addEventListener('click',()=>{ const v=curView(); if(v!=='verify'&&v!=='favs'&&v!=='checkout'&&v!=='done'){ closeSheet(); go('favs'); } });
$('#logo').addEventListener('click',()=>{ S.nav=['home']; closeSheet(); render(); window.scrollTo(0,0); });
if(tg){ try{ tg.BackButton.onClick(back); }catch(e){} }
applyTheme();
init();
</script>
</body>
</html>
